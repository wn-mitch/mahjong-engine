name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10 # matches local pnpm; lockfileVersion 9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # gate: typecheck (svelte-check)
      - run: pnpm test # gate: vitest
      - run: pnpm build # gate: production build compiles (Cloudflare Pages publishes separately)
